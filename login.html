<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Đại sứ WIN</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Design tokens (theo Design Guideline WCM) ── */
    --bd:#003087; --bm:#0057B8; --ac:#00C48C; --a2:#FF6B35; --wn:#FFB800;
    --bg:#F0F4FA; --sf:#FFFFFF; --br:#DDE4F0;
    --tx:#1A2340; --tm:#6B7A99; --ng:#F53B3B;
    --r:12px; --sh:0 2px 16px rgba(0,48,135,.10);
    --ok:#00875F; --ok-bg:rgba(0,196,140,.12);
    --warn:#B87800; --warn-bg:rgba(255,184,0,.12);
    --err:#B52020; --err-bg:rgba(245,59,59,.10);
    /* ── Alias để tương thích ngược với tên biến cũ ── */
    --navy:var(--bd); --navy2:#001F6B; --gold:var(--wn); --red:var(--ng); --ink:var(--tx); --muted:var(--tm);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:"Be Vietnam Pro",sans-serif; margin:0; padding:20px;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    position:relative; overflow-x:hidden;
  }
  /* Dải sóng xanh nhạt phía dưới nền, gợi ý từ backdrop poster */
  body::before {
    content:''; position:fixed; left:0; right:0; bottom:0; height:38vh; pointer-events:none; z-index:0;
    background:
      radial-gradient(120% 90% at 22% 100%, rgba(90,200,255,.18), transparent 60%),
      radial-gradient(120% 90% at 78% 100%, rgba(40,150,230,.16), transparent 60%),
      radial-gradient(140% 100% at 50% 120%, rgba(20,110,190,.14), transparent 65%);
  }
  .card { position:relative; z-index:1; background:var(--sf); border-radius:var(--r); width:100%; max-width:380px; overflow:hidden; box-shadow:0 24px 48px rgba(0,48,135,.28); }
  .card-hero {
    background:linear-gradient(135deg,#001F6B 0%,var(--navy) 45%,var(--bm) 100%);
    background-image:linear-gradient(135deg,#001F6B 0%,var(--navy) 45%,var(--bm) 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 28px),repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 28px);
    padding:26px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:10px;
    border-bottom:3px solid var(--gold);
  }
  .logo-badge { display:inline-flex; align-items:center; background:#fff; border-radius:8px; padding:5px 12px; }
  .logo-badge img { height:20px; display:block; }
  .dsw-logo { display:inline-flex; align-items:center; }
  .dsw-logo img { height:56px; display:block; }
  .card-body { padding:26px 32px 32px; }
  h1 { font-size:19px; font-weight:800; color:var(--navy); text-align:center; margin:0 0 22px; }
  label { display:block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; color:var(--bm); }
  input { width:100%; padding:11px 14px; border:1.5px solid var(--br); border-radius:9px; font-size:14px; margin-bottom:14px; font-family:"Be Vietnam Pro",sans-serif; color:var(--tx); outline:none; transition:.2s; }
  input:focus { border-color:var(--bm); box-shadow:0 0 0 3px rgba(0,87,184,.1); }
  button { width:100%; background:var(--bd); color:#fff; border:none; padding:12px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; transition:transform .12s ease,box-shadow .12s ease; font-family:"Be Vietnam Pro",sans-serif; }
  button:hover { background:var(--bm); transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,48,135,.25); }
  button.secondary { background:var(--navy); }
  .msg { font-size:13px; font-weight:600; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none; }
  .msg.ok { background:var(--ok-bg); color:var(--ok); display:block; }
  .msg.err { background:var(--err-bg); color:var(--err); display:block; }
  .step { display:none; }
  .step.active { display:block; }
  .link { text-align:center; font-size:12px; color:var(--muted); margin-top:8px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="card">
  <div class="card-hero">
    <div class="logo-badge"><img src="https://datax-talent.basecdn.net/winmart/logo.png" alt="WinCommerce"></div>
    <div class="dsw-logo"><img src="https://s3.hn-2.cloud.cmctelecom.vn/rop/prod/UploadFile/2026/07/02/2026070214080186231910f253.png" alt="Đại sứ WIN"></div>
  </div>
  <div class="card-body">
    <h1>Đăng nhập</h1>
    <div id="msg" class="msg"></div>

    <!-- Bước 1: chỉ nhập email -> hệ thống tự kiểm tra đã có mật khẩu chưa và chuyển đúng bước -->
    <div class="step active" id="stepEmail">
      <label>Email công ty</label>
      <input type="text" id="email" placeholder="ten@winmart.masangroup.com">
      <button id="btnContinue">Tiếp tục</button>
    </div>

    <!-- Bước 2a: đã có mật khẩu -> đăng nhập bằng mật khẩu -->
    <div class="step" id="stepPassword">
      <label>Mật khẩu</label>
      <input type="password" id="password">
      <button id="btnDoLogin">Đăng nhập</button>
      <div class="link" id="linkForgot">Quên mật khẩu? Nhận mã OTP để đặt lại</div>
      <div class="link" id="linkBack1">← Quay lại</div>
    </div>

    <!-- Bước 2b: chưa có mật khẩu (lần đầu) hoặc đang đặt lại mật khẩu -->
    <div class="step" id="stepOtp">
      <label>Mã OTP đã gửi tới email</label>
      <input type="text" id="otp" placeholder="6 chữ số">
      <label>Tạo mật khẩu cá nhân</label>
      <input type="password" id="newPassword" placeholder="Tối thiểu 6 ký tự">
      <button id="btnSetPassword">Xác nhận & tạo mật khẩu</button>
      <div class="link" id="linkBack2">← Quay lại</div>
    </div>
  </div>
</div>

<script src="api.js?v=15"></script>
<script>
function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}
function clearMsg() {
  const el = document.getElementById('msg');
  el.textContent = '';
  el.className = 'msg';
}
function showStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function withBusy(btn, label, fn) {
  return async () => {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = label;
    try { await fn(); }
    finally { btn.disabled = false; btn.textContent = original; }
  };
}

prefillEmailDomain(document.getElementById('email'));

document.getElementById('linkBack1').onclick = () => { showStep('stepEmail'); clearMsg(); };
document.getElementById('linkBack2').onclick = () => { showStep('stepEmail'); clearMsg(); };

// Bước 1: chỉ nhập email. Hệ thống tự kiểm tra tài khoản đã có mật khẩu chưa để chuyển đúng bước —
// lần đầu (chưa có mật khẩu) tự động gửi OTP luôn, không bắt người dùng thử mật khẩu rồi mới báo lỗi.
document.getElementById('btnContinue').onclick = withBusy(document.getElementById('btnContinue'), 'Đang kiểm tra...', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) return showMsg('Vui lòng nhập email.', false);
  const status = await Api.checkAccountStatus(email);
  if (!status.success) return showMsg(status.message, false);

  if (status.hasPassword) {
    clearMsg();
    showStep('stepPassword');
    setTimeout(() => document.getElementById('password').focus(), 0);
    return;
  }

  // Chưa có mật khẩu -> đây là lần đăng nhập đầu tiên, tự động gửi OTP luôn.
  const res = await Api.requestOtp(email);
  if (!res.success) return showMsg(res.message, false);
  showMsg('Lần đầu đăng nhập — đã gửi mã OTP tới email để bạn tạo mật khẩu.', true);
  showStep('stepOtp');
});

// Quên mật khẩu: gửi lại OTP để đặt mật khẩu mới, dùng chung màn hình OTP với luồng lần đầu.
document.getElementById('linkForgot').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) return showMsg('Vui lòng nhập email trước.', false);
  const res = await Api.requestOtp(email);
  showMsg(res.success ? 'Đã gửi mã OTP để đặt lại mật khẩu.' : res.message, res.success);
  if (res.success) showStep('stepOtp');
};

document.getElementById('btnSetPassword').onclick = withBusy(document.getElementById('btnSetPassword'), 'Đang xác nhận...', async () => {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const newPassword = document.getElementById('newPassword').value;
  if (newPassword.length < 6) return showMsg('Mật khẩu tối thiểu 6 ký tự.', false);
  const res = await Api.verifyOtpSetPassword(email, otp, newPassword);
  showMsg(res.message, res.success);
  if (res.success) {
    showStep('stepPassword');
    document.getElementById('password').value = '';
    setTimeout(() => document.getElementById('password').focus(), 0);
  }
});

document.getElementById('btnDoLogin').onclick = withBusy(document.getElementById('btnDoLogin'), 'Đang đăng nhập...', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const res = await Api.login(email, password);
  if (res.success) {
    Session.save({ token: res.token, role: res.role, phamVi: res.phamVi, email, hoTen: res.hoTen });
    window.location.href = 'dashboard.html';
  } else {
    showMsg(res.message, false);
  }
});
</script>
</body>
</html>
